<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusSales AI | Executive Sales Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700&family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root {
    --en-body: 'Outfit', sans-serif;
    --en-display: 'Playfair Display', Georgia, serif;
    --ar-body: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif;
    --ar-display: 'Amiri', 'Noto Naskh Arabic', serif;
}
html { font-size: 90%; scroll-behavior: smooth; }
body {
    font-family: var(--en-body);
    background-color: #040711;
    color: #f8fafc;
    background-image:
        radial-gradient(at 10% 15%, hsla(250, 85%, 58%, 0.20) 0px, transparent 55%),
        radial-gradient(at 90% 10%, hsla(190, 85%, 50%, 0.16) 0px, transparent 55%),
        radial-gradient(at 50% 90%, hsla(320, 85%, 55%, 0.14) 0px, transparent 55%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}
.font-playfair, .hero-display { font-family: var(--en-display); }

body.arabic-mode { font-family: var(--ar-body); }
body.arabic-mode .font-playfair,
body.arabic-mode .hero-display {
    font-family: var(--ar-display);
    font-weight: 700;
    line-height: 1.55 !important;
}
body.arabic-mode * { letter-spacing: 0 !important; text-transform: none !important; }
body.arabic-mode .italic { font-style: normal !important; }
body.arabic-mode .leading-relaxed { line-height: 2 !important; }
body.arabic-mode .text-left { text-align: right !important; }
body.arabic-mode .insight-box {
    border-left: none; border-right: 4px solid #818cf8;
    border-radius: 12px 0 0 12px;
}
body.arabic-mode .feature-num { right: auto; left: -8px; }
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.js-plotly-plot { direction: ltr; }

body::before {
    content: ''; position: fixed; inset: 0; z-index: -3; pointer-events: none;
    background-image:
        radial-gradient(1.5px 1.5px at 100px 200px, rgba(255,255,255,0.95), transparent),
        radial-gradient(1px 1px at 300px 100px, rgba(200,220,255,0.8), transparent),
        radial-gradient(2px 2px at 500px 300px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 700px 150px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 200px 500px, rgba(180,200,255,0.85), transparent),
        radial-gradient(1px 1px at 800px 400px, rgba(255,255,255,0.75), transparent),
        radial-gradient(2px 2px at 450px 600px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 650px 700px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1.5px 1.5px at 950px 200px, rgba(200,220,255,0.7), transparent),
        radial-gradient(1px 1px at 50px 800px, rgba(255,255,255,0.85), transparent);
    background-size: 1300px 900px; background-repeat: repeat;
    animation: nexusTwinkle 8s ease-in-out infinite alternate;
}
body::after {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
        linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
    background-size: 55px 55px;
    mask-image: radial-gradient(ellipse at 50% 45%, black 15%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 45%, black 15%, transparent 75%);
}
@keyframes nexusTwinkle { 0%{opacity:.35;} 100%{opacity:1;} }
#fx-canvas { position: fixed; inset: 0; z-index: -2; pointer-events: none; opacity: .85; }
.orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: -2; opacity: .5; }
.orb-1 { width: 420px; height: 420px; top: -120px; left: -100px; background: #4f46e5; animation: orbA 22s ease-in-out infinite alternate; }
.orb-2 { width: 360px; height: 360px; top: 30%; right: -120px; background: #0891b2; animation: orbB 26s ease-in-out infinite alternate; }
.orb-3 { width: 380px; height: 380px; bottom: -140px; left: 30%; background: #be185d; opacity: .35; animation: orbA 30s ease-in-out infinite alternate-reverse; }
@keyframes orbA { to { transform: translate(120px, 90px) scale(1.15); } }
@keyframes orbB { to { transform: translate(-110px, -80px) scale(1.2); } }

.reveal { animation: revealUp .85s cubic-bezier(.2,.7,.2,1) var(--d, 0s) backwards; }
@keyframes revealUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinRev { to { transform: rotate(-360deg); } }
@keyframes gradShift { to { background-position: 200% center; } }
@keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); } 70% { box-shadow: 0 0 0 9px rgba(52,211,153,0); } }

.glass-nav {
    background: rgba(4, 7, 17, 0.82);
    backdrop-filter: blur(22px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.brand-tile {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #a855f7 55%, #ec4899);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px -6px rgba(139,92,246,.8);
}
.nav-link {
    color: #cbd5e1; font-weight: 600; font-size: .88rem;
    padding: .45rem .9rem; border-radius: 999px; cursor: pointer;
    transition: all .25s ease; white-space: nowrap;
}
.nav-link:hover { color: #fff; background: rgba(129,140,248,.14); }
.nav-link.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(99,102,241,.38), rgba(168,85,247,.26));
    box-shadow: inset 0 0 0 1px rgba(129,140,248,.5);
}
.lang-toggle { border: 1px solid rgba(255,255,255,.16); border-radius: 999px; overflow: hidden; }
.lang-btn {
    padding: 6px 14px; background: transparent; color: #94a3b8;
    font-weight: 600; font-size: .8rem; border: none; cursor: pointer;
    transition: all .25s;
}
.lang-btn.active { background: #6366f1; color: #fff; }

.glass-card {
    background: rgba(18, 26, 45, 0.7);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    color: white;
}
.glass-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 25px 45px -12px rgba(99, 102, 241, 0.35);
    border-color: rgba(99, 102, 241, 0.5);
}
.hero-text {
    background: linear-gradient(110deg, #818cf8 0%, #22d3ee 25%, #c084fc 50%, #f472b6 75%, #818cf8 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradShift 7s linear infinite;
}
.insight-box {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(192, 132, 252, 0.05) 100%);
    border-left: 4px solid #818cf8; border-radius: 0 12px 12px 0;
}
.glow-line {
    height: 2px; width: 100%;
    background: linear-gradient(90deg,transparent,#818cf8,#22d3ee,#c084fc,transparent);
    background-size: 200% 100%; animation: glowMove 5s linear infinite; opacity: .8;
}
@keyframes glowMove { to { background-position: 200% 0; } }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; display: inline-block; animation: pulseDot 2s infinite; }
.kpi-icon {
    width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: rgba(99,102,241,.14); border: 1px solid rgba(129,140,248,.25);
}

.hero-visual { position: relative; width: 100%; max-width: 760px; margin: 6px auto 0; }
.hero-visual svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 30px 60px rgba(79,70,229,.35)); }
.vbar { transform-box: fill-box; transform-origin: 50% 100%; animation: barGrow 1.1s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes barGrow { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
.draw-line { stroke-dasharray: 1; stroke-dashoffset: 0; animation: drawLine 2.6s ease-out .5s backwards; }
@keyframes drawLine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.fade-in { animation: fadeIn 1.6s ease 1.4s backwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.donut-seg { transform-box: fill-box; transform-origin: center; animation: donutIn 1.6s ease-out .6s backwards; }
@keyframes donutIn { from { opacity: 0; transform: rotate(-120deg); } to { opacity: 1; transform: none; } }
.float-chip {
    position: absolute; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px 10px 10px; border-radius: 16px; z-index: 3;
    background: rgba(15,23,42,.8); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: 0 18px 40px -14px rgba(0,0,0,.75);
    animation: floatY 5.5s ease-in-out infinite;
    text-align: start;
}
.chip-1 { top: 6%;  left: -2%;  animation-delay: 0s; }
.chip-2 { top: -3%; right: 0%;  animation-delay: -1.8s; }
.chip-3 { bottom: 4%; right: -3%; animation-delay: -3.2s; }
.chip-icon { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
.chip-label { font-size: 10.5px; color: #94a3b8; font-weight: 600; line-height: 1.2; }
.chip-value { font-size: 15px; color: #fff; font-weight: 800; line-height: 1.3; max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.upload-bubble-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 0 18px; position: relative; }
.upload-bubble-wrap::before {
    content: ''; position: absolute; width: 260px; height: 260px; top: -8px; left: 50%;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(168,85,247,.30) 0%, transparent 70%);
    pointer-events: none; animation: bubblePulse 3.4s ease-in-out infinite;
}
@keyframes bubblePulse {
    0%,100% { transform: translateX(-50%) scale(1); opacity: .6; }
    50% { transform: translateX(-50%) scale(1.18); opacity: .95; }
}
.ring { position: absolute; left: 50%; top: 28px; border-radius: 50%; pointer-events: none; }
.ring-1 { width: 252px; height: 252px; margin: -31px 0 0 -126px; border: 1px dashed rgba(165,180,252,.5); animation: spin 22s linear infinite; }
.ring-2 { width: 312px; height: 312px; margin: -61px 0 0 -156px; border: 1px dotted rgba(34,211,238,.45); animation: spinRev 34s linear infinite; }
.ring-1::after, .ring-2::after {
    content: ''; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; border-radius: 50%;
    background: #22d3ee; box-shadow: 0 0 14px 3px rgba(34,211,238,.8);
}
.ring-2::after { background: #f472b6; box-shadow: 0 0 14px 3px rgba(244,114,182,.8); }
.upload-bubble {
    width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #a5b4fc 0%, #6366f1 40%, #7c3aed 70%, #be185d 100%);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 28px 60px -12px rgba(139, 92, 246, 0.7),
                inset 0 -10px 22px rgba(0, 0, 0, 0.28), inset 0 8px 20px rgba(255, 255, 255, 0.28);
    transition: all .35s cubic-bezier(.4,0,.2,1);
    animation: bubbleFloat 4s ease-in-out infinite; position: relative; z-index: 1;
}
.upload-bubble:hover { transform: scale(1.08); box-shadow: 0 35px 80px -12px rgba(139, 92, 246, 0.95), inset 0 -10px 22px rgba(0,0,0,.28), inset 0 8px 20px rgba(255,255,255,.35); }
.upload-bubble:active { transform: scale(0.97); }
@keyframes bubbleFloat { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
.upload-bubble-label { font-size: 16px; font-weight: 700; color: #e0e7ff; text-align: center; z-index: 1; }
.upload-bubble-sub { font-size: 11px; color: #94a3b8; letter-spacing: .8px; font-weight: 600; z-index: 1; }

.feature-card {
    background: rgba(18,26,45,.7); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 24px;
    position: relative; overflow: hidden; transition: all .35s cubic-bezier(.4,0,.2,1);
}
.feature-card::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(500px circle at 20% -10%, rgba(129,140,248,.14), transparent 60%);
}
.feature-card:hover { transform: translateY(-6px) scale(1.015); border-color: rgba(129,140,248,.55); box-shadow: 0 25px 50px -12px rgba(99,102,241,.4); }
.feature-num {
    position: absolute; top: -22px; right: -8px; font-size: 6.5rem; font-weight: 800; line-height: 1;
    color: rgba(129,140,248,.08); font-family: var(--en-display); pointer-events: none;
}
.feature-icon {
    width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px -6px rgba(99,102,241,.45); margin-bottom: 16px;
}
.step-card {
    background: rgba(18,26,45,.65); border: 1px solid rgba(255,255,255,.08); border-radius: 22px;
    position: relative; overflow: hidden; transition: all .35s ease;
}
.step-card:hover { border-color: rgba(129,140,248,.5); transform: translateY(-4px); }
.step-num-badge {
    width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg,#4338ca,#7c3aed);
    display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff;
    box-shadow: 0 8px 18px -4px rgba(99,102,241,.5);
}
.rec-num {
    width: 36px; height: 36px; flex: none; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(99,102,241,.35), rgba(168,85,247,.25));
    border: 1px solid rgba(129,140,248,.4);
}
.ripple-btn { position: relative; overflow: hidden; transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s; }
.ripple-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(99, 102, 241, 0.55); }

select.dark-select {
    background: rgba(30, 41, 59, 0.8);
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.875rem;
    outline: none;
}
select.dark-select:focus { border-color: #6366f1; }
select.dark-select option { background: #0f172a; }

@media (max-width: 900px) {
    html { font-size: 100%; }
    .glass-nav { padding-left: 10px !important; padding-right: 10px !important; }
    .nav-links { overflow-x: auto; max-width: 100%; flex-wrap: nowrap !important; }
    .upload-bubble { width: 155px; height: 155px; }
    .ring { display: none; }
    .float-chip { transform: scale(.8); }
    .chip-3 { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>

<header class="glass-nav py-3 px-6 lg:px-10 flex justify-between items-center sticky top-0 z-50 gap-3">
    <div class="flex items-center gap-3 cursor-pointer flex-nowrap" onclick="setPage('home')">
        <div class="brand-tile"><i class="material-icons" style="font-size:1.4rem;color:#fff">insights</i></div>
        <span class="text-xl font-playfair font-bold text-white tracking-tight">NexusSales AI</span>
    </div>
    <div id="nav-links" class="flex gap-1 items-center nav-links flex-nowrap"></div>
    <div class="lang-toggle flex">
        <button class="lang-btn" data-lang="en" onclick="changeLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="ar" onclick="changeLanguage('ar')">عربي</button>
    </div>
</header>

<main id="content-container" class="w-full pb-12"></main>

<footer id="footer" class="w-full flex justify-center py-8 mt-12 border-t border-gray-800 text-gray-400 text-sm items-center gap-1"></footer>

<input type="file" id="fileInput" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleFileUpload(event)">

<!-- Chat -->
<div id="chat-dialog" class="hidden" style="position:fixed;bottom:100px;right:25px;z-index:100;">
    <div class="p-0 flex flex-col overflow-hidden rounded-2xl bg-gray-900 border border-gray-700 shadow-2xl" style="width:min(420px,calc(100vw - 50px));height:min(580px,calc(100vh - 180px));">
        <div class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 p-4 text-white flex items-center gap-3">
            <i class="material-icons" style="font-size:2rem">psychology</i>
            <div class="flex flex-col">
                <div id="chatTitle" class="text-base font-bold leading-tight"></div>
                <div id="chatSub" class="text-xs text-indigo-100"></div>
            </div>
        </div>
        <div id="chatMessages" class="flex-1 w-full overflow-y-auto p-4 bg-gray-900"></div>
        <div class="w-full p-3 bg-gray-800 flex items-center gap-2 border-t border-gray-700">
            <input id="chatInput" class="flex-1 bg-gray-900 text-white rounded px-3 py-2 border border-gray-700 outline-none focus:border-indigo-500 text-sm" onkeydown="if(event.key==='Enter'){event.preventDefault();handleChat();}" />
            <button onclick="handleChat()" class="bg-indigo-600 text-white rounded-full w-9 h-9 flex items-center justify-center hover:bg-indigo-500"><i class="material-icons" style="font-size:1.2rem">send</i></button>
        </div>
    </div>
</div>
<button id="chat-fab" onclick="toggleChat()" class="fixed z-40 rounded-full shadow-xl hover:scale-110 transition-transform ripple-btn" style="bottom:25px;right:25px;width:60px;height:60px;background:#6366f1;color:#fff;display:flex;align-items:center;justify-content:center;">
    <i class="material-icons" style="font-size:2rem">psychology</i>
</button>

<script>
/* ============================================================
   STATE
   ============================================================ */
const state = {
    df: null,
    page: 'home',
    datasetMode: null,
    currencyCode: 'USD',
    currencySymbol: '$',
    language: 'en'
};

const CURRENCY_SYMBOLS = {
    'USD': '$', 'GBP': '£', 'EUR': '€', 'SAR': '﷼',
    'AED': 'د.إ', 'EGP': 'E£', 'JPY': '¥', 'INR': '₹',
    'KWD': 'KD', 'QAR': 'QR', 'BHD': 'BD', 'OMR': 'RO'
};

/* ============================================================
   TRANSLATIONS
   ============================================================ */
const TEXT = {
    app_name: ["NexusSales AI", "NexusSales AI"],

    upload_bubble_subtitle: ["CSV · XLSX · XLS", "CSV · XLSX · XLS"],
    upload_success: ["Data imported successfully ({n} rows).", "تم استيراد البيانات بنجاح ({n} سجل)."],
    upload_error: ["Could not import file: {e}", "تعذّر استيراد الملف: {e}"],
    err_read: ["Could not read the file.", "تعذّرت قراءة الملف."],
    err_empty: ["The file is empty.", "الملف فارغ."],
    err_type: ["Only CSV, XLSX and XLS files are supported.", "الملفات المدعومة هي CSV وXLSX وXLS فقط."],
    err_nodata: ["The file contains no data.", "لا يحتوي الملف على بيانات."],
    err_norows: ["No valid rows were found in the file.", "لم يتم العثور على سجلات صالحة في الملف."],
    preview_title: ["Sales Overview & Executive Snapshot", "نظرة عامة على المبيعات والمؤشرات التنفيذية"],
    preview_hint: ["Click the chart below to open the full interactive dashboard", "انقر على الرسم البياني أدناه لفتح لوحة المؤشرات التفاعلية الكاملة"],
    preview_badge: ["Demo Preview Mode", "وضع المعاينة التجريبية"],

function t(key, params) {
    const pair = TEXT[key] || [key, key];
    let s = state.language === 'en' ? pair[0] : pair[1];
    if (params) {
        for (const k in params) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
    }
    return s;
}

function iso(x) {
    const s = String(x);
    return state.language === 'ar' ? `\u2068${s}\u2069` : s;
}

function fmtDate(d) {
    if (state.language === 'ar') {
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function money(v, dec = 2) {
    const n = Number(v) || 0;
    return state.currencySymbol + n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function datasetLabel() {
    return state.datasetMode === null ? t('demo_dataset') : state.datasetMode;
}

function mulberry32(a) {
    return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function showToast(msg, type = 'info') {
    const toast = document.createElement('div');
    const bg = type === 'positive' ? '#059669' : type === 'negative' ? '#dc2626' : '#4f46e5';
    toast.style.cssText = `position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 24px;border-radius:10px;color:#fff;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);background:${bg};opacity:0;transition:opacity .25s,transform .25s;`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.style.opacity = '1'; });
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, -20px)';
        setTimeout(() => toast.remove(), 300);
    }, 3500);
}

   ============================================================ */
function getDemoData() {
    const products = [
        ["Enterprise Suite Pro", 2500, 0.12],
        ["Cloud Analytics License", 1200, 0.30],
        ["Hardware Gateway X", 450, 0.20],
        ["Consulting Package", 1800, 0.10],
        ["AI Add-On Module", 650, 0.18],
        ["Premium Maintenance", 200, 0.10]
    ];
    const countries = [
        ["United States", 0.38], ["United Kingdom", 0.22], ["Germany", 0.15],
        ["Saudi Arabia", 0.12], ["UAE", 0.08], ["Canada", 0.05]
    ];
    const qtyChoices = [1, 2, 3, 5, 10];
    const qtyWeights = [0.50, 0.28, 0.12, 0.07, 0.03];

    function pick(arr, weights) {
        const r = rand();
        let acc = 0;
        for (let i = 0; i < arr.length; i++) {
            acc += weights[i];
            if (r < acc) return arr[i];
        }
        return arr[arr.length - 1];
    }

    const rand = mulberry32(42);
    const startTs = new Date(2025, 0, 1).getTime();
    const endTs = new Date(2026, 11, 31).getTime();
    const range = endTs - startTs;
    const rows = [];
    const N = 10000;

    for (let i = 0; i < N; i++) {
        const ts = startTs + rand() * range;
        const d0 = new Date(ts);
        const dateOnly = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate());

        const p = pick(products, products.map(x => x[2]));
        const price = Math.round(p[1] * (0.95 + rand() * 0.10) * 100) / 100;
        const qty = pick(qtyChoices, qtyWeights);
        const c = pick(countries, countries.map(x => x[1]));

        rows.push({
            InvoiceNo: `INV-${500000 + i}`,
            Description: p[0],
            Quantity: qty,
            InvoiceDate: dateOnly,
            Date: new Date(dateOnly),
            UnitPrice: price,
            Country: c[0],
            Revenue: qty * price
        });
    }
    return rows;
}

/* ============================================================
   CLEAN DATA (for uploads)
   ============================================================ */
function parseNum(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).replace(/[^\d.\-]/g, '');
    if (!s) return null;
    const n = parseFloat(s);
    return isFinite(n) ? n : null;
}

function parseDate(v) {
    if (v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
    if (typeof v === 'number') {
        const ms = (v - 25569) * 86400 * 1000;
        const d = new Date(ms);
        if (!isNaN(d)) return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    }
    if (v === null || v === undefined) return null;
    const s = String(v).trim();
    if (!s) return null;
    let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
    if (m) {
        let y = parseInt(m[3]);
        if (y < 100) y += 2000;
        return new Date(y, parseInt(m[2]) - 1, parseInt(m[1]));
    }
    const d = new Date(s);
    if (!isNaN(d)) return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return null;
}

function detectCurrency(rows) {
    if (!rows.length) return 'USD';
    const patterns = [
        ['$', 'USD'], ['£', 'GBP'], ['€', 'EUR'], ['ر.س', 'SAR'],
        ['د.إ', 'AED'], ['﷼', 'SAR'], ['E£', 'EGP'], ['¥', 'JPY'], ['₹', 'INR'],
        ['AED', 'AED'], ['SAR', 'SAR'], ['USD', 'USD'], ['GBP', 'GBP']
    ];
    const keys = Object.keys(rows[0]);
    for (const key of keys) {
        const sample = rows.slice(0, 200).map(r => String(r[key] ?? '')).join(' ').toUpperCase();
        for (const [sym, code] of patterns) {
            if (sample.includes(sym.toUpperCase())) return code;
        }
    }
    return 'USD';
}

function cleanData(rows) {
    if (!rows.length) return [];
    const columns = Object.keys(rows[0]);
    const colMap = {};
    const assigned = new Set();
    const tests = [
        [['date', 'time', 'day', 'invoice_date', 'التاريخ', 'الوقت'], 'InvoiceDate'],
        [['qty', 'quantity', 'units', 'الكمية', 'العدد', 'count'], 'Quantity'],
        [['price', 'unit_price', 'rate', 'cost', 'السعر', 'التكلفة', 'amount'], 'UnitPrice'],
        [['product', 'item', 'desc', 'title', 'name', 'المنتج', 'الصنف'], 'Description'],
        [['country', 'region', 'market', 'location', 'state', 'الدولة', 'المنطقة'], 'Country'],
        [['invoice', 'order_id', 'bill', 'code', 'رقم'], 'InvoiceNo'],
        [['revenue', 'sales', 'total_sales', 'total', 'الإيرادات', 'المبيعات'], 'DirectRevenue']
    ];
    for (const col of columns) {
        const cl = String(col).toLowerCase();
        for (const [keywords, target] of tests) {
            if (assigned.has(target)) continue;
            if (keywords.some(k => cl.includes(k))) {
                colMap[col] = target;
                assigned.add(target);
                break;
            }
        }
    }

    const cleaned = [];
    for (const row of rows) {
        const out = {};
        for (const [k, v] of Object.entries(row)) {
            const target = colMap[k];
            if (target) out[target] = v;
        }
        const d = out.InvoiceDate ? parseDate(out.InvoiceDate) : null;
        if (!d) continue;
        out.InvoiceDate = d;
        out.Date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        out.Quantity = parseNum(out.Quantity) ?? 1;
        out.UnitPrice = parseNum(out.UnitPrice) ?? 100;
        const direct = parseNum(out.DirectRevenue);
        out.Revenue = direct !== null ? direct : out.Quantity * out.UnitPrice;
        out.Description = out.Description && String(out.Description).trim() ? String(out.Description).trim() : 'Standard Product Line';
        out.Country = out.Country && String(out.Country).trim() ? String(out.Country).trim() : 'Global Market';
        if (!out.InvoiceNo) out.InvoiceNo = 'INV-' + Math.floor(Math.random() * 1000000);
        cleaned.push(out);
    }
    return cleaned;
}

/* ============================================================
   AGGREGATIONS
   ============================================================ */
function groupByMonth(df) {
    const map = {};
    for (const r of df) {
        const d = r.InvoiceDate;
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        map[key] = (map[key] || 0) + r.Revenue;
    }
    return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0]))
        .map(([k, v]) => ({ month: k, value: v }));
}

function groupByDate(df) {
    const map = {};
    for (const r of df) {
        const k = dateKey(r.Date);
        map[k] = (map[k] || 0) + r.Revenue;
    }
    return map;
}

function groupByField(df, field, valueField = 'Revenue') {
    const map = {};
    for (const r of df) {
        const k = String(r[field] ?? '—');
        map[k] = (map[k] || 0) + (Number(r[valueField]) || 0);
    }
    return Object.entries(map).map(([k, v]) => ({ key: k, value: v }));
}

function computeChipStats(df) {
    let growthTxt = "—", topMarket = "—", orders = 0;
    try {
        const m = groupByMonth(df);
        if (m.length >= 2 && m[m.length - 2].value) {
            const g = (m[m.length - 1].value / m[m.length - 2].value - 1) * 100;
            growthTxt = (g >= 0 ? '+' : '') + g.toFixed(1) + '%';
        }
        const markets = groupByField(df, 'Country');
        if (markets.length) topMarket = markets.sort((a, b) => b.value - a.value)[0].key;
        const invSet = new Set(df.map(r => r.InvoiceNo));
        orders = invSet.size;
    } catch (e) {}
    return { growthTxt, topMarket, orders };
}

/* ============================================================
   FORECAST (simple regression + weekday seasonality)
   ============================================================ */
function runForecast(df, horizon) {
    const daily = groupByDate(df);
    const keys = Object.keys(daily).sort();
    if (keys.length < 10) {
        const lastDate = keys.length ? new Date(keys[keys.length - 1]) : new Date();
        const future = [];
        const preds = [];
        const base = keys.length ? Object.values(daily).reduce((a, b) => a + b, 0) / keys.length : 1500;
        for (let i = 1; i <= horizon; i++) {
            const d = new Date(lastDate); d.setDate(d.getDate() + i);
            future.push(d);
            preds.push(base * (1 + (Math.random() - 0.5) * 0.15));
        }
        const mae = preds.reduce((a, b) => a + Math.abs(b * 0.04), 0) / preds.length;
        const rmse = preds.reduce((a, b) => a + Math.abs(b * 0.07), 0) / preds.length;
        return { dates: future, y: new Array(horizon).fill(0), pred: preds, mae, rmse };
    }

    const start = new Date(keys[0]);
    const end = new Date(keys[keys.length - 1]);
    const filled = [];
    const vals = [];
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const k = dateKey(d);
        filled.push(new Date(d));
        vals.push(daily[k] || 0);
    }

    const n = vals.length;
    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (let i = 0; i < n; i++) {
        sumX += i; sumY += vals[i]; sumXY += i * vals[i]; sumXX += i * i;
    }
    const denom = n * sumXX - sumX * sumX;
    const slope = denom ? (n * sumXY - sumX * sumY) / denom : 0;
    const intercept = (sumY - slope * sumX) / n;

    const weekdaySum = new Array(7).fill(0);
    const weekdayCount = new Array(7).fill(0);
    for (let i = 0; i < n; i++) {
        const wd = filled[i].getDay();
        weekdaySum[wd] += vals[i];
        weekdayCount[wd] += 1;
    }
    const avgAll = sumY / n;
    const seasonal = weekdaySum.map((s, i) => weekdayCount[i] ? (s / weekdayCount[i]) / (avgAll || 1) : 1);

    const futureDates = [];
    const preds = [];
    for (let h = 1; h <= horizon; h++) {
        const d = new Date(end);
        d.setDate(d.getDate() + h);
        futureDates.push(d);
        const trend = intercept + slope * (n - 1 + h);
        preds.push(Math.max(0, trend * seasonal[d.getDay()]));
    }

    const backN = Math.min(horizon, n);
    const actualSubset = vals.slice(-backN);
    const backPreds = [];
    for (let i = 0; i < backN; i++) {
        const idx = n - backN + i;
        const trend = intercept + slope * idx;
        backPreds.push(Math.max(0, trend * seasonal[filled[idx].getDay()]));
    }
    let mae = 0, rmse = 0;
    for (let i = 0; i < backN; i++) {
        mae += Math.abs(actualSubset[i] - backPreds[i]);
        rmse += Math.pow(actualSubset[i] - backPreds[i], 2);
    }
    mae = backN ? mae / backN : 0;
    rmse = backN ? Math.sqrt(rmse / backN) : 0;

    return { dates: futureDates, y: actualSubset, pred: preds, mae, rmse };
}

function heroSvg() {

    const hs = [60, 85, 70, 110, 95, 140, 125, 170];

    function smooth(pts) {
        let d = `M${pts[0][0]} ${pts[0][1]}`;
        for (let i = 0; i < pts.length - 1; i++) {
            const [x0, y0] = pts[i];
            const [x1, y1] = pts[i + 1];
            const dx = (x1 - x0) * 0.5;
            d += ` C${(x0 + dx).toFixed(1)} ${y0} ${(x1 - dx).toFixed(1)} ${y1} ${x1} ${y1}`;
        }
        return d;
    }
    const pts = xs.map((x, i) => [x, ys[i]]);
    const line = smooth(pts);
    const area = `${line} L${xs[xs.length - 1]} 320 L${xs[0]} 320 Z`;

      <stop offset="0" stop-color="#1e293b" stop-opacity=".92"/><stop offset="1" stop-color="#0f172a" stop-opacity=".92"/>

  <rect x="20" y="20" width="680" height="340" rx="26" fill="url(#gPanel)" stroke="rgba(255,255,255,.12)"/>

  <rect x="130" y="44" width="150" height="12" rx="6" fill="rgba(255,255,255,.08)"/>
  <rect x="560" y="44" width="110" height="12" rx="6" fill="rgba(129,140,248,.25)"/>
  ${grid}

function renderExplorer() {
    const d = state.df.slice(0, 500);
    if (!d.length) {
        document.getElementById('content-container').innerHTML = '<div class="w-full max-w-7xl mx-auto px-6 pt-6"><div class="text-white">No data.</div></div>';
        return;
    }
    const cols = ['InvoiceNo', 'Description', 'Quantity', 'InvoiceDate', 'UnitPrice', 'Country', 'Revenue'];
    const headers = cols.map(c => `<th class="text-left p-2 text-gray-300 font-bold bg-gray-800 sticky top-0 whitespace-nowrap">${c}</th>`).join('');
    const rowsHtml = d.map(r => {
        const cells = cols.map(c => {
            let v = r[c];
            if (v instanceof Date) v = dateKey(v);
            else if (c === 'UnitPrice' || c === 'Revenue') v = Number(v).toFixed(2);
            else if (c === 'Quantity') v = String(v);
            else v = String(v ?? '');
            return `<td class="p-2 text-gray-200 border-b border-gray-800 whitespace-nowrap">${escapeHtml(v)}</td>`;
        }).join('');
        return `<tr class="hover:bg-gray-800/40">${cells}</tr>`;
    }).join('');

    const html = `
    <div class="w-full max-w-7xl mx-auto px-6 pt-6">
        <div class="text-4xl font-playfair font-bold mb-2 text-white mt-2 reveal">${t('explorer_title')}</div>

                <thead><tr>${headers}</tr></thead>
                <tbody>${rowsHtml}</tbody>
            </table>
        </div>
    </div>`;
    document.getElementById('content-container').innerHTML = html;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function generateBotResponse(msg) {
    if (!state.df || !state.df.length) return t('bot_no_data');
    const q = msg.toLowerCase();
    const df = state.df;
    const totalRev = df.reduce((a, r) => a + r.Revenue, 0);
    const orders = new Set(df.map(r => r.InvoiceNo)).size;
    const amt = money(totalRev);

    if (['revenue', 'sales', 'income', 'إيراد', 'ايراد', 'مبيعات', 'المبيعات', 'دخل'].some(k => q.includes(k)))
        return t('bot_revenue', { amt: iso(amt), orders: orders.toLocaleString('en-US') });
    if (['best', 'product', 'item', 'أفضل', 'افضل', 'منتج', 'المنتج', 'منتجات'].some(k => q.includes(k))) {
        const s = groupByField(df, 'Description');
        return t('bot_product', { name: iso(s.length ? s.sort((a, b) => b.value - a.value)[0].key : '—') });
    }
    if (['market', 'country', 'region', 'سوق', 'أسواق', 'اسواق', 'دولة', 'الدولة', 'منطقة'].some(k => q.includes(k))) {
        const s = groupByField(df, 'Country');
        return t('bot_market', { name: iso(s.length ? s.sort((a, b) => b.value - a.value)[0].key : '—') });
    }
    return t('bot_default', { amt: iso(amt) });
}

    addChatMessage('chat_user', escapeHtml(val));

function handleFileUpload(event) {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    const lower = file.name.toLowerCase();
    const isCSV = lower.endsWith('.csv');
    const isExcel = lower.endsWith('.xlsx') || lower.endsWith('.xls');
    if (!isCSV && !isExcel) {
        showToast(t('err_type'), 'negative');
        return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = e.target.result;
            let rows = [];
            if (isCSV) {
                const parsed = Papa.parse(data, { header: true, skipEmptyLines: true });
                rows = parsed.data || [];
            } else {
                const wb = XLSX.read(new Uint8Array(data), { type: 'array', cellDates: true });
                const ws = wb.Sheets[wb.SheetNames[0]];
                rows = XLSX.utils.sheet_to_json(ws, { defval: null, raw: false });
            }
            if (!rows.length) {
                showToast(t('err_nodata'), 'negative');
                return;
            }
            const detected = detectCurrency(rows);
            const cleaned = cleanData(rows);
            if (!cleaned.length) {
                showToast(t('err_norows'), 'negative');
                return;
            }
            state.df = cleaned;
            state.datasetMode = file.name;
            state.currencyCode = detected || 'USD';
            state.currencySymbol = CURRENCY_SYMBOLS[state.currencyCode] || '$';
            showToast(t('upload_success', { n: cleaned.length.toLocaleString('en-US') }), 'positive');
            setPage('dashboard');
        } catch (err) {
            console.error(err);
            showToast(t('upload_error', { e: String(err.message || err) }), 'negative');
        }
    };
    if (isCSV) reader.readAsText(file, 'utf-8');
    else reader.readAsArrayBuffer(file);
}

/* ============================================================
   EFFECTS
   ============================================================ */
function runCountUps() {
    document.querySelectorAll('.count-up').forEach(el => {
        if (el.dataset.counted) return;
        el.dataset.counted = '1';
        const txt = el.textContent.trim();
        const m = txt.match(/^([^\d]*)([\d,]+(?:\.(\d+))?)(.*)$/);
        if (!m) return;
        const pre = m[1];
        const num = parseFloat(m[2].replace(/,/g, ''));
        const dec = m[3] ? m[3].length : 0;
        const suf = m[4];
        if (!isFinite(num) || num === 0) return;
        const dur = 1500;
        const t0 = performance.now();
        (function step(now) {
            const p = Math.min(1, (now - t0) / dur);
            const e = 1 - Math.pow(1 - p, 3);
            el.textContent = pre + (num * e).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
            if (p < 1) requestAnimationFrame(step);
            else el.textContent = txt;
        })(t0);
    });
}

function initRipple() {
    document.addEventListener('click', function(e) {
        const btn = e.target.closest('.ripple-btn');
        if (!btn) return;
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 1.8;
        const ripple = document.createElement('span');
        Object.assign(ripple.style, {
            position: 'absolute', width: size + 'px', height: size + 'px',
            left: (e.clientX - rect.left - size / 2) + 'px',
            top: (e.clientY - rect.top - size / 2) + 'px',
            borderRadius: '50%', pointerEvents: 'none', zIndex: '2',
            background: 'radial-gradient(circle,rgba(255,255,255,.72) 0%,rgba(129,140,248,.38) 38%,rgba(255,255,255,0) 72%)',
            transform: 'scale(0)', opacity: '1',
            transition: 'transform .7s ease-out,opacity .7s ease-out'
        });
        if (getComputedStyle(btn).position === 'static') btn.style.position = 'relative';
        btn.style.overflow = 'hidden';
        btn.appendChild(ripple);
        requestAnimationFrame(() => { ripple.style.transform = 'scale(1)'; ripple.style.opacity = '0'; });
        setTimeout(() => ripple.remove(), 750);
    }, true);
}

function initParticles() {
    ['orb-1', 'orb-2', 'orb-3'].forEach(c => {
        const d = document.createElement('div');
        d.className = 'orb ' + c;
        document.body.appendChild(d);
    });
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.createElement('canvas');
    cv.id = 'fx-canvas';
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    let W, H, pts = [], mouse = { x: -999, y: -999 };
    function resize() {
        W = cv.width = window.innerWidth;
        H = cv.height = window.innerHeight;
        const n = Math.min(80, Math.floor(W * H / 24000));
        pts = Array.from({ length: n }, () => ({
            x: Math.random() * W, y: Math.random() * H,
            vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
            r: Math.random() * 1.6 + .6
        }));
    }
    window.addEventListener('resize', resize);
    resize();
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    (function draw() {
        if (!document.hidden) {
            ctx.clearRect(0, 0, W, H);
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;
                const dx = p.x - mouse.x, dy = p.y - mouse.y;
                const md = Math.hypot(dx, dy);
                if (md < 110) { p.x += dx / md * .9; p.y += dy / md * .9; }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, 6.283);
                ctx.fillStyle = 'rgba(165,180,252,.75)';
                ctx.fill();
                for (let j = i + 1; j < pts.length; j++) {
                    const q = pts[j];
                    const d = Math.hypot(p.x - q.x, p.y - q.y);
                    if (d < 130) {
                        ctx.strokeStyle = 'rgba(129,140,248,' + (0.18 * (1 - d / 130)) + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(q.x, q.y);
                        ctx.stroke();
                    }
                }
            }
        }
        requestAnimationFrame(draw);
    })();
}
